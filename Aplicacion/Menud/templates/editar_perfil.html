{% extends './plantilla.html' %}
{% load static %}

{% block contenido %}

<br><br><br>
<div id="banner"></div>

<!-- CONTENEDOR PRINCIPAL -->
<div class="wrapper">
    <div class="card">

        <!-- TÍTULO -->
        <h2>Editar Perfil</h2>

        <!-- Mensajes de Django -->
        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" enctype="multipart/form-data" id="formEditar">
            {% csrf_token %}

            <!-- FOTO DE PERFIL (preview) -->
            <div class="preview-box">
                <img id="preview-img"
                     src="{% if perfil.foto %}{{ perfil.foto.url }}{% else %}{% static 'img/default.png' %}{% endif %}"
                     alt="Foto de perfil">
            </div>

            <!-- Input file -->
            <div class="input-group" style="margin-bottom:15px;">
                <input type="file" name="foto" id="file-input" accept="image/*" style="padding:10px;">
                <small style="color:rgba(255,255,255,0.5); display:block; text-align:center; margin-top:4px;">JPG, PNG (máx. 2MB)</small>
            </div>

            <!-- Teléfono -->
            <div class="input-group">
                <i class="fas fa-phone"></i>
                {{ form.telefono }}
            </div>

            <!-- Dirección -->
            <div class="input-group">
                <i class="fas fa-map-marker-alt"></i>
                {{ form.direccion }}
            </div>

            <!-- BOTONES -->
            <button type="submit" class="btn"> Guardar</button>

            <a href="{% url 'perfil_admin' %}" class="btn-cancelar">⬅ Cancelar</a>

        </form>

    </div>
</div>

<!-- ===== CSS ===== -->
<style>
/* RESET Y FUENTE */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* FONDO */
#banner {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: url("{% static 'tema/food-funday-master/images/banner.jpg' %}");
    background-size: cover;
    background-position: center;
    z-index: 1;
    filter: brightness(0.60);
}

/* WRAPPER: centra la card */
.wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* CARD */
.card {
    width: 400px;
    max-width: 100%;
    backdrop-filter: blur(18px);
    background: rgba(248, 236, 236, 0.12);
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    color: white;
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* TÍTULO */
.card h2 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
    color: #fff;
}

/* PREVIEW DE FOTO */
.preview-box {
    text-align: center;
    margin-bottom: 15px;
}
.preview-box img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.6);
    padding: 3px;
    background: rgba(0,0,0,0.3);
}

/* INPUT GROUP */
.input-group {
    position: relative;
    margin-bottom: 18px;
}
.input-group i {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.7;
    color: #ccc;
}
.input-group input,
.input-group select,
.input-group textarea {
    width: 100%;
    padding: 12px 12px 12px 35px;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.5);
    background: rgba(0, 0, 0, 0.3);
    color: white;
    border-radius: 8px;
    font-size: 14px;
}
.input-group input::placeholder,
.input-group textarea::placeholder {
    color: rgba(255,255,255,0.6);
}
.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus {
    outline: none;
    border-bottom: 1px solid #ff4b2b;
    background: rgba(0, 0, 0, 0.5);
}

/* Input file */
#file-input {
    width: 100%;
    padding: 10px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    color: white;
    cursor: pointer;
}
#file-input::file-selector-button {
    background: #e60023;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    color: white;
    font-weight: 600;
    margin-right: 12px;
    cursor: pointer;
}

/* BOTÓN GUARDAR */
.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
    background: #e60023;
    color: white;
    font-size: 15px;
    font-weight: 600;
    transition: 0.3s;
}
.btn:hover {
    background: #c4001d;
    transform: scale(1.03);
}

/* BOTÓN CANCELAR */
.btn-cancelar {
    display: block;
    text-align: center;
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    color: white;
    text-decoration: none;
    font-weight: 500;
    transition: 0.3s;
    border: 1px solid rgba(255,255,255,0.2);
}
.btn-cancelar:hover {
    background: rgba(255,255,255,0.2);
    text-decoration: none;
    color: white;
}

/* MENSAJES */
.error {
    background: rgba(255, 50, 50, 0.2);
    color: #ff6b6b;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 10px;
    text-align: center;
    font-size: 14px;
}
.success {
    background: rgba(50, 255, 50, 0.15);
    color: #6bff6b;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 10px;
    text-align: center;
    font-size: 14px;
}

/* RESPONSIVE */
@media (max-width: 500px) {
    .card {
        padding: 20px;
        width: 100%;
    }
}
</style>

<!-- ===== PREVISUALIZACIÓN DE IMAGEN ===== -->
<script>
document.getElementById("file-input").addEventListener("change", function() {
    const file = this.files[0];
    const preview = document.getElementById("preview-img");
    if (!file) return;
    if (!file.type.startsWith("image/")) {
        alert("Solo imágenes");
        this.value = "";
        return;
    }
    if (file.size > 2 * 1024 * 1024) {
        alert("Máx 2MB");
        this.value = "";
        return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
        preview.src = e.target.result;
    };
    reader.readAsDataURL(file);
});
</script>

{% endblock %}
