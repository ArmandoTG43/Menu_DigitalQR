{% extends './plantilla.html' %}
{% load static %}

{% block contenido %}

<div id="banner"></div>

<br><br><br><br>

<div class="container">

    <h2 class="title"><i class="fa-solid fa-kitchen-set"></i> Pedidos Activos</h2>
    <div id="grid" class="grid-cocina"></div>
    <div class="historial-section">
        
        <div class="filtro-historial">
            <label for="fechaHistorial"> SELECCIONE LA FECHA PARA VISUALIZAR LOS PEDIDOS ENTREGADOS:</label>
            <input type="date" id="fechaHistorial" class="form-control" value="{{ hoy|date:'Y-m-d' }}">
            <button id="btnCargarHistorial" class="btn btn-primary"><i class="fa-solid fa-search"></i> Cargar</button>
            <button id="btnLimpiarHistorial" class="btn btn-secondary"><i class="fa-solid fa-undo"></i> Limpiar</button>
        </div>
        
        <div id="historial-grid" class="grid-historial">
            <div class="sin-pedidos">
                <i class="fa-solid fa-calendar-day"></i><br>
                Seleccione una fecha y presione "Cargar"
            </div>
        </div>
    </div>

</div>

<audio id="campanita" preload="auto">
    <source src="{% static 'sounds/campanita.mp3' %}" type="audio/mp3">
</audio>

<style>
body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: 'Segoe UI', sans-serif;
}

#banner {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: url("{% static 'tema/food-funday-master/images/banner.jpg' %}");
    background-size: cover;
    background-position: center;
    z-index: 1;
    filter: brightness(0.60);
}

.container {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.title {
    text-align: center;
    margin-bottom: 20px;
    color: white;
    font-size: 28px;
}

.title i {
    color: #e76e05;
    margin-right: 10px;
}

.grid-cocina {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 20px;
}

.grid-historial {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.card {
    background: rgba(255,255,255,0.12);
    color: white;
    padding: 20px;
    border-radius: 15px;
    animation: fadeIn 0.5s;
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.18);
}

.card .badge-entrega {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 10px;
}

.badge-local {
    background: #22c55e;
    color: white;
}

.badge-domicilio {
    background: #3b82f6;
    color: white;
}

.card .domicilio-info {
    background: rgba(59,130,246,0.15);
    border-radius: 10px;
    padding: 10px;
    margin: 10px 0;
    font-size: 13px;
    border-left: 3px solid #3b82f6;
}

.card .domicilio-info i {
    color: #3b82f6;
    width: 20px;
}

.card .personalizado-info {
    background: rgba(139,92,246,0.15);
    border-radius: 10px;
    padding: 10px;
    margin: 10px 0;
    font-size: 13px;
    border-left: 3px solid #8b5cf6;
}

.card .personalizado-info i {
    color: #8b5cf6;
    width: 20px;
}

.card .total-pedido {
    font-size: 18px;
    font-weight: bold;
    color: #f59e0b;
    margin-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 10px;
}

.card-historial {
    background: rgba(255,255,255,0.08);
    color: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    transition: 0.3s;
}

.card-historial:hover {
    background: rgba(255,255,255,0.12);
}

.card-historial .mesa-titulo {
    font-size: 20px;
    font-weight: bold;
    color: #e76e05;
    border-bottom: 2px solid rgba(231, 110, 5, 0.3);
    padding-bottom: 10px;
    margin-bottom: 10px;
}

.card-historial .total-mesa {
    font-size: 18px;
    font-weight: bold;
    text-align: right;
    border-top: 2px solid rgba(231, 110, 5, 0.3);
    padding-top: 10px;
    margin-top: 10px;
    color: #f59e0b;
}

.tabla-productos {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

.tabla-productos th {
    text-align: left;
    padding: 5px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    color: #9ca3af;
    font-weight: normal;
}

.tabla-productos td {
    padding: 5px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.tabla-productos .text-right {
    text-align: right;
}

.tabla-productos .text-center {
    text-align: center;
}

@keyframes fadeIn {
    from {opacity:0; transform:scale(0.9);}
    to {opacity:1;}
}

@keyframes campanitaAnim {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(15deg); }
    75% { transform: rotate(-15deg); }
    100% { transform: rotate(0deg); }
}

.estado {
    padding: 8px;
    border-radius: 10px;
    text-align: center;
    margin: 10px 0;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.pendiente { background: #ffc107; color: #000; }
.en_preparacion { background: #17a2b8; color: white; }
.listo { background: #28a745; color: white; }
.entregado { background: #6c757d; color: white; }

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    padding: 10px 15px;
    border-radius: 10px;
    color: white;
    text-decoration: none;
    margin-top: 10px;
    transition: 0.3s;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.btn-cambiar { background: #e76e05; }
.btn-cambiar:hover { background: #f59e0b; }

.btn-entregar { background: #28a745; }
.btn-entregar:hover { background: #34ce57; }

.btn-primary { background: #e76e05; }
.btn-primary:hover { background: #f59e0b; }

.btn-secondary { background: #6c757d; }
.btn-secondary:hover { background: #8a9299; }

.sin-pedidos {
    text-align: center;
    padding: 40px;
    color: #9ca3af;
    font-size: 18px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    grid-column: 1 / -1;
}

.sin-pedidos i {
    font-size: 48px;
    margin-bottom: 10px;
    color: #e76e05;
}

.productos-lista {
    margin: 10px 0;
    padding-left: 15px;
}

.productos-lista p {
    margin: 5px 0;
    font-size: 13px;
}

.productos-lista i {
    color: #e76e05;
    width: 20px;
    margin-right: 5px;
}

.mesa-badge {
    display: inline-block;
    background: rgba(231, 110, 5, 0.3);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 10px;
}

.pedido-id {
    font-size: 18px;
    margin-bottom: 10px;
}

.filtro-historial {
    display: flex;
    flex-wrap: nowrap; 
    align-items: center;
    gap: 15px;
    justify-content: center;
    margin: 20px 0;
    background: rgba(255,255,255,0.05);
    padding: 15px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
}

.filtro-historial label {
    font-weight: bold;
    color: #e76e05;
    white-space: nowrap;
}

.filtro-historial input[type="date"] {
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 16px;
    min-width: 180px;
}

.filtro-historial input[type="date"]:focus {
    outline: none;
    border-color: #e76e05;
}

.filtro-historial .btn {
    margin-top: 0;
    flex-shrink: 0;
}

@media (max-width: 700px) {
    .filtro-historial {
        flex-wrap: wrap;
        justify-content: center;
    }
}

.notificacion {
    position: fixed;
    top: 20px;
    right: 20px;
    background: linear-gradient(135deg, #e76e05, #f59e0b);
    color: white;
    padding: 15px 20px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    z-index: 1000;
    animation: slideIn 0.5s ease;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
}

.notificacion i {
    font-size: 24px;
    animation: campanitaAnim 0.5s ease;
}

@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}
</style>

<script>
let idsPedidosPrevios = new Set();
let pedidosPrevios = [];

function reproducirCampanita() {
    const audio = document.getElementById('campanita');
    if (audio) {
        audio.currentTime = 0;
        audio.play().catch(function(e) {
            console.log("Error al reproducir audio:", e);
        });
    }
}

function mostrarNotificacion(pedido) {
    let productosMsg = '';
    if (pedido.productos && pedido.productos.length > 0) {
        const nombres = pedido.productos.map(p => `${p.nombre} x${p.cantidad}`).join(', ');
        productosMsg = ` - ${nombres}`;
    }
    
    const notificacion = document.createElement('div');
    notificacion.className = 'notificacion';
    notificacion.innerHTML = `
        <i class="fa-solid fa-bell"></i>
        <span> Nuevo Pedido #${pedido.id} - Mesa ${pedido.mesa}${productosMsg}</span>
    `;
    document.body.appendChild(notificacion);
    
    setTimeout(() => {
        notificacion.remove();
    }, 5000);
}

async function cargarPedidos() {
    try {
        const res = await fetch("/api/pedidos/");
        
        if (!res.ok) {
            console.error("Error en la API:", res.status);
            return;
        }
        
        const data = await res.json();
        console.log("Datos recibidos:", data);
        
        const grid = document.getElementById("grid");
        if (!grid) {
            console.error("No se encontró el grid");
            return;
        }
        
        const esPrimeraCarga = (idsPedidosPrevios.size === 0);
        const idsActuales = new Set(data.map(p => p.id));
        
        if (!esPrimeraCarga) {
            const nuevosPedidos = data.filter(p => 
                !idsPedidosPrevios.has(p.id) && p.estado !== "entregado"
            );
            
            if (nuevosPedidos.length > 0) {
                console.log("Nuevos pedidos detectados:", nuevosPedidos.length);
                reproducirCampanita();
                nuevosPedidos.forEach(pedido => {
                    mostrarNotificacion(pedido);
                });
                
                if (navigator.vibrate) {
                    navigator.vibrate([200, 100, 200]);
                }
            }
        }
        
        idsPedidosPrevios = idsActuales;
        
        let pedidosActivos = [];
        let pedidosEntregados = [];

        data.forEach(p => {
            if (p.estado === "entregado") {
                pedidosEntregados.push(p);
            } else {
                pedidosActivos.push(p);
            }
        });
        
        const esAdmin = "{{ user.rol }}" === "admin";

        if (pedidosActivos.length === 0) {
            grid.innerHTML = `
                <div class="sin-pedidos">
                    <i class="fa-solid fa-plate-wheat"></i><br>
                    No hay pedidos activos
                </div>
            `;
        } else {
            grid.innerHTML = "";
            pedidosActivos.forEach(p => {
                let productosHtml = "";
                if (p.productos && p.productos.length > 0) {
                    p.productos.forEach(d => {
                        const esPersonalizado = d.nombre && d.nombre.includes('Personalizado');
                        const tieneIngredientes = d.ingredientes && d.ingredientes.length > 0;
                        
                        // Extraer nombre original (quitar "Personalizado" y paréntesis)
                        let nombreMostrar = d.nombre;
                        if (esPersonalizado) {
                            nombreMostrar = d.nombre.replace('Personalizado', '').trim();
                            nombreMostrar = nombreMostrar.replace(/^[()]/, '').trim();
                            if (!nombreMostrar) nombreMostrar = d.nombre;
                        }
                        
                        productosHtml += `
                            <div style="margin-bottom:10px;padding:8px 10px;background:rgba(255,255,255,0.04);border-radius:8px;border-left:3px solid ${esPersonalizado ? '#a855f7' : '#f59e0b'};">
                                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;">
                                    <span style="font-size:14px;">
                                        <i class="fa-solid fa-utensils" style="color:#e76e05;"></i> 
                                        <strong style="color:#fff;">${nombreMostrar}</strong>
                                        ${esPersonalizado ? '<span style="color:#a855f7;font-size:10px;background:rgba(168,85,247,0.2);padding:2px 8px;border-radius:10px;margin-left:6px;"> Personalizado</span>' : ''}
                                    </span>
                                    <strong style="color:#f59e0b;font-size:14px;">x${d.cantidad} ($${d.subtotal ? d.subtotal.toFixed(2) : (d.precio * d.cantidad).toFixed(2)})</strong>
                                </div>
                                ${tieneIngredientes ? `
                                    <div style="margin-top:4px;font-size:12px;color:#c4b5fd;background:rgba(168,85,247,0.06);padding:4px 10px;border-radius:6px;display:flex;flex-wrap:wrap;gap:4px;">
                                        <span style="color:#a855f7;"><i class="fa-solid fa-carrot"></i> Ingredientes:</span>
                                        ${d.ingredientes.map(ing => `<span style="background:rgba(168,85,247,0.12);padding:1px 8px;border-radius:12px;border:1px solid rgba(168,85,247,0.15);">${ing}</span>`).join(' ')}
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });
                } else {
                    productosHtml = `<p style="color:#9ca3af;font-size:13px;"><i class="fa-solid fa-exclamation-triangle"></i> Sin productos</p>`;
                }

                let estadoTexto = "";
                if (p.estado === "pendiente") estadoTexto = " Pendiente";
                else if (p.estado === "en_preparacion") estadoTexto = " En Preparación";
                else if (p.estado === "listo") estadoTexto = " Listo";

                let domicilioHtml = "";
                if (p.es_domicilio) {
                    domicilioHtml = `
                        <div class="domicilio-info">
                            <div><i class="fa-solid fa-truck-fast"></i> <strong> PEDIDO A DOMICILIO</strong></div>
                            ${p.direccion_entrega ? `<div><i class="fa-solid fa-location-dot"></i> <strong>Dirección:</strong> ${p.direccion_entrega}</div>` : ''}
                            ${p.hora_entrega ? `<div><i class="fa-solid fa-clock"></i> <strong>Hora requerida:</strong> ${p.hora_entrega}</div>` : ''}
                            ${p.instrucciones_adicionales ? `<div><i class="fa-solid fa-comment"></i> <strong>Notas entrega:</strong> ${p.instrucciones_adicionales}</div>` : ''}
                        </div>
                    `;
                } else {
                    domicilioHtml = `
                        <div class="domicilio-info" style="border-left-color:#22c55e;background:rgba(34,197,94,0.1);">
                            <div><i class="fa-solid fa-chair" style="color:#22c55e;"></i> <strong style="color:#22c55e;">Consumir en Local (Mesa ${p.mesa})</strong></div>
                        </div>
                    `;
                }

                let boton = "";
                if (!esAdmin) {
                    if (p.estado === "listo") {
                        boton = `<a href="/entregar/${p.id}/" class="btn btn-entregar"><i class="fa-solid fa-check-double"></i> Entregar Pedido</a>`;
                    } else {
                        boton = `<a href="/cocina/estado/${p.id}/" class="btn btn-cambiar"><i class="fa-solid fa-arrow-right"></i> Cambiar Estado</a>`;
                    }
                }

                grid.innerHTML += `
                    <div class="card">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                            <div class="pedido-id" style="margin:0;font-size:16px;">
                                <i class="fa-solid fa-receipt"></i> Pedido #${p.id}
                            </div>
                            <span class="badge-entrega ${p.es_domicilio ? 'badge-domicilio' : 'badge-local'}">
                                ${p.es_domicilio ? ' Domicilio' : ` Mesa ${p.mesa}`}
                            </span>
                        </div>
                        <div class="estado ${p.estado}">
                            ${estadoTexto}
                        </div>
                        ${domicilioHtml}
                        <div class="productos-lista">
                            ${productosHtml}
                        </div>
                        <div style="margin-top:10px;font-size:12px;color:#9ca3af;">
                            <i class="fa-solid fa-clock"></i> ${p.fecha_hora}
                        </div>
                        <div class="total-pedido">
                            <i class="fa-solid fa-dollar-sign"></i> Total: $${p.total ? p.total.toFixed(2) : '0.00'}
                        </div>
                        ${boton}
                    </div>
                `;
            });
        }

        pedidosPrevios = data;
        
    } catch (error) {
        console.error("Error al cargar pedidos:", error);
        const grid = document.getElementById("grid");
        if (grid) {
            grid.innerHTML = `
                <div class="sin-pedidos">
                    <i class="fa-solid fa-exclamation-triangle"></i><br>
                    Error al cargar pedidos: ${error.message}
                </div>
            `;
        }
    }
}

async function cargarHistorial(fecha) {
    const historialGrid = document.getElementById("historial-grid");
    if (!historialGrid) return;
    
    historialGrid.innerHTML = `
        <div class="sin-pedidos">
            <i class="fa-solid fa-spinner fa-spin"></i><br>
            Cargando historial...
        </div>
    `;
    
    try {
        const url = `/api/historial/?fecha=${fecha}`;
        const res = await fetch(url);
        
        if (!res.ok) {
            const errorData = await res.json();
            throw new Error(errorData.error || 'Error al cargar historial');
        }
        
        const data = await res.json();
        console.log("Historial recibido:", data);
        
        if (data.length === 0) {
            historialGrid.innerHTML = `
                <div class="sin-pedidos">
                    <i class="fa-solid fa-calendar-xmark"></i><br>
                    No hay pedidos entregados en esta fecha
                </div>
            `;
            return;
        }
        
        historialGrid.innerHTML = "";
        data.forEach(mesaData => {
            const { mesa, productos, total_mesa } = mesaData;
            
            let productosHtml = `
                <table class="tabla-productos">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th class="text-center">Cant.</th>
                            <th class="text-right">Precio</th>
                            <th class="text-right">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            productos.forEach(p => {
                productosHtml += `
                    <tr>
                        <td>${p.nombre}</td>
                        <td class="text-center">${p.cantidad}</td>
                        <td class="text-right">$${p.precio.toFixed(2)}</td>
                        <td class="text-right">$${p.subtotal.toFixed(2)}</td>
                    </tr>
                `;
            });
            
            productosHtml += `
                    </tbody>
                </table>
            `;
            
            historialGrid.innerHTML += `
                <div class="card-historial">
                    <div class="mesa-titulo">
                        <i class="fa-solid fa-chair"></i> Mesa ${mesa}
                    </div>
                    ${productosHtml}
                    <div class="total-mesa">
                        Total Mesa: $${total_mesa.toFixed(2)}
                    </div>
                    <div style="font-size:11px;color:#9ca3af;margin-top:8px;">
                        <i class="fa-solid fa-receipt"></i> Pedidos: ${mesaData.pedidos_ids.join(', ')}
                    </div>
                </div>
            `;
        });
        
    } catch (error) {
        console.error("Error al cargar historial:", error);
        historialGrid.innerHTML = `
            <div class="sin-pedidos">
                <i class="fa-solid fa-exclamation-triangle"></i><br>
                Error: ${error.message}
            </div>
        `;
    }
}

document.addEventListener('DOMContentLoaded', function() {
    cargarPedidos();
    setInterval(cargarPedidos, 5000);
    
    document.getElementById('btnCargarHistorial').addEventListener('click', function() {
        const fecha = document.getElementById('fechaHistorial').value;
        if (!fecha) {
            alert('Por favor seleccione una fecha');
            return;
        }
        cargarHistorial(fecha);
    });
    
    document.getElementById('btnLimpiarHistorial').addEventListener('click', function() {
        const historialGrid = document.getElementById('historial-grid');
        historialGrid.innerHTML = `
            <div class="sin-pedidos">
                <i class="fa-solid fa-calendar-day"></i><br>
                Seleccione una fecha y presione "Cargar"
            </div>
        `;
        document.getElementById('fechaHistorial').value = '';
    });
    
    document.getElementById('fechaHistorial').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('btnCargarHistorial').click();
        }
    });
});
</script>

{% endblock %}
