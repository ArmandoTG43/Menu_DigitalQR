<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago - Freedom Lounge</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            margin: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .detalle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }
        .resumen-pedido {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid #2c5364;
        }
        .item-pedido {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .item-pedido:last-child {
            border-bottom: none;
        }
        .item-nombre {
            font-weight: 500;
        }
        .item-precio {
            color: #2c5364;
        }
        .total {
            font-size: 28px;
            font-weight: bold;
            color: #00c853;
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 10px;
        }
        select, button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }
        select {
            background: white;
        }
        button {
            background: #00c853;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #00a844;
            transform: scale(1.02);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .lock {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2> Realizar Pago</h2>
    <div class="detalle">Pedido #{{ pedido.id }} - Mesa {{ pedido.mesa.numero }}</div>
    
    <div class="total">
        Total: ${{ pedido.total|floatformat:2 }}
    </div>

    <form method="post" action="{% url 'confirmar_pago' %}">
        {% csrf_token %}
        <input type="hidden" name="pedido_id" value="{{ pedido.id }}">

        <label for="metodo">Selecciona método de pago:</label>
        <select name="metodo" id="metodo" required>
            <option value="efectivo"> Efectivo (en el local)</option>
            <option value="transferencia"> Transferencia Bancaria</option>
        </select>

        <button type="submit" {% if not detalles %}disabled{% endif %}>
            {% if detalles %} Pagar ahora{% else %} Sin productos para pagar{% endif %}
        </button>
    </form>

    <div class="lock"> Pago seguro con bancos</div>
</div>
</body>
</html>
