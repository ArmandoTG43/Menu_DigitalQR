{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recuperar contraseña</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="shortcut icon" href="{% static 'tema/food-funday-master/images/rest.ico' %}">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    height: 100vh;
    background: url("{% static 'tema/food-funday-master/images/banner.jpg' %}") no-repeat center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 50px;
    position: relative;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.3); /
}

/* ===== CARD ===== */
.card {
    position: relative;
    width: 380px;
    padding: 35px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(18px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    color: white;
    text-align: center;
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.card h2 {
    margin-bottom: 20px;
    font-weight: 700;
}

.card h2 i {
    color: #e60023;
    margin-right: 10px;
}

/* ===== INPUT ===== */
.input-group {
    position: relative;
    margin: 15px 0;
}

.input-group input {
    width: 100%;
    padding: 14px 40px 14px 14px;
    border: none;
    border-radius: 10px;
    outline: none;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border: 1px solid transparent;
    transition: 0.3s;
}

.input-group input::placeholder {
    color: #ddd;
}

.input-group input:focus {
    border: 1px solid #e60023;
    background: rgba(255, 255, 255, 0.15);
}

.input-group i {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #ccc;
}

/* ===== BOTÓN ===== */
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #e60023;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

button:hover {
    background: #be123c;
    transform: scale(1.02);
}

button i {
    margin-right: 8px;
}

/* ===== INFO ===== */
.info {
    margin-top: 15px;
    font-size: 12px;
    opacity: 0.8;
}

.info a {
    color: #ff6b6b;
    text-decoration: none;
}

.info a:hover {
    text-decoration: underline;
}

/* ===== ERROR ===== */
.error {
    background: rgba(220, 38, 38, 0.2);
    color: #fca5a5;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    text-align: center;
    border: 1px solid rgba(220, 38, 38, 0.3);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
    body {
        padding: 20px;
    }
    .card {
        width: 100%;
        max-width: 380px;
    }
}
</style>

</head>

<body>

<!-- ===== CARD ===== -->
<div class="card">

    <h2><i class="fa-solid fa-unlock-keyhole"></i> Recuperar contraseña</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            {{ form.email }}
            <i class="fa-solid fa-envelope"></i>
        </div>

        <button>
            <i class="fa-solid fa-paper-plane"></i> Enviar enlace
        </button>

    </form>

    <div class="info">
        <i class="fa-regular fa-circle-check"></i> Te enviaremos un enlace seguro a tu correo electrónico
        <br><br>
        <i class="fa-regular "></i> <a href="{% url 'login' %}">Volver al login</a>
    </div>

</div>

</body>
</html>
