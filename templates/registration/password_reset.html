{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Recuperar contraseña</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
    --primary:#e11d48;
    --primary-dark:#be123c;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("{% static 'img/fondo-comida.jpg' %}") no-repeat center/cover;
    position:relative;
}

/* overlay */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.6);
}

/* CARD */
.card{
    position:relative;
    width:380px;
    padding:35px;
    border-radius:18px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    color:white;
    text-align:center;
    animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

.card h2{
    margin-bottom:20px;
    font-weight:700;
}

/* INPUT */
.input-group{
    position:relative;
    margin:15px 0;
}

.input-group input{
    width:100%;
    padding:14px 40px 14px 14px;
    border:none;
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,0.1);
    color:white;
    border:1px solid transparent;
    transition:0.3s;
}

.input-group input:focus{
    border:1px solid var(--primary);
    background:rgba(255,255,255,0.15);
}

.input-group i{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    color:#ccc;
}

/* BOTÓN */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:var(--primary);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

button:hover{
    background:var(--primary-dark);
    transform:scale(1.02);
}

/* INFO */
.info{
    margin-top:15px;
    font-size:12px;
    opacity:0.8;
}
</style>

</head>

<body>

<div class="card">

    <h2><i class="fa-solid fa-unlock-keyhole"></i> Recuperar contraseña</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            {{ form.email }}
            <i class="fa-solid fa-envelope"></i>
        </div>

        <button>
            Enviar enlace
        </button>

    </form>

    <div class="info">
        Te enviaremos un enlace seguro a tu correo electrónico
    </div>

</div>

</body>
</html>
