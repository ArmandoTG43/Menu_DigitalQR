{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nueva contraseña</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
    --primary:#e11d48;
    --primary-dark:#be123c;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* BACKGROUND */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("{% static 'img/fondo-comida.jpg' %}") no-repeat center/cover;
    position:relative;
}

/* OVERLAY */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.6);
}

/* CARD */
.card{
    position:relative;
    width:400px;
    padding:35px;
    border-radius:18px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    color:white;
    animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

.card h2{
    text-align:center;
    margin-bottom:20px;
    font-weight:700;
}

/* ERROR */
.error{
    background:rgba(255,0,0,0.15);
    border:1px solid rgba(255,0,0,0.3);
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
    font-size:13px;
}

/* INPUTS */
.input-group{
    position:relative;
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    padding:14px 40px 14px 14px;
    border:none;
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,0.1);
    color:white;
    border:1px solid transparent;
    transition:0.3s;
}

.input-group input:focus{
    border:1px solid var(--primary);
    background:rgba(255,255,255,0.15);
}

.input-group i{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    color:#ccc;
}

/* BUTTON */
.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:var(--primary);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

.btn:hover{
    background:var(--primary-dark);
    transform:scale(1.03);
}

/* INFO */
.info{
    margin-top:12px;
    font-size:12px;
    opacity:0.75;
    text-align:center;
}
</style>

</head>

<body>

<div class="card">

    <h2>
        <i class="fa-solid fa-lock"></i> Nueva contraseña
    </h2>

    {% if form.errors %}
        <div class="error">
             Corrige los errores e intenta nuevamente
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            {{ form.new_password1 }}
            <i class="fa-solid fa-key"></i>
        </div>

        <div class="input-group">
            {{ form.new_password2 }}
            <i class="fa-solid fa-check"></i>
        </div>

        <button class="btn">
            Cambiar contraseña
        </button>

    </form>

    <div class="info">
        Usa una contraseña segura con mínimo 8 caracteres
    </div>

</div>

</body>
</html>
