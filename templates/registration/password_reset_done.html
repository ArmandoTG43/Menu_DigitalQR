{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Correo enviado</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="shortcut icon" href="{% static 'tema/food-funday-master/images/rest.ico' %}">

<style>
:root{
    --primary:#e11d48;
    --primary-dark:#be123c;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* BACKGROUND */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("{% static 'tema/food-funday-master/images/banner.jpg' %}") no-repeat center/cover;
    position:relative;
}

/* DARK OVERLAY (MÁS CLARO) */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.3);
}

/* CARD */
.card{
    position:relative;
    width:400px;
    padding:40px 30px;
    border-radius:18px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    color:white;
    text-align:center;
    animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* ICON */
.icon{
    font-size:55px;
    margin-bottom:15px;
    color:#22c55e;
    animation:pop 0.5s ease;
}

@keyframes pop{
    0%{transform:scale(0.5); opacity:0;}
    100%{transform:scale(1); opacity:1;}
}

/* TEXT */
.card h2{
    font-size:22px;
    margin-bottom:10px;
    font-weight:700;
}

.card p{
    font-size:14px;
    opacity:0.85;
    line-height:1.5;
    margin-bottom:25px;
}

/* BUTTON */
.btn{
    display:inline-block;
    width:100%;
    padding:14px;
    border-radius:10px;
    background:var(--primary);
    color:white;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
}

.btn:hover{
    background:var(--primary-dark);
    transform:scale(1.03);
}

/* small note */
.small{
    margin-top:12px;
    font-size:12px;
    opacity:0.7;
}
</style>

</head>

<body>

<div class="card">

    <div class="icon">
        <i class="fa-solid fa-envelope-circle-check"></i>
    </div>

    <h2>Correo enviado</h2>

    <p>
        Hemos enviado un enlace seguro para restablecer tu contraseña.<br>
        Revisa tu bandeja de entrada o la carpeta de spam.
    </p>

    <a href="{% url 'login' %}" class="btn">
        Volver al login
    </a>

    <div class="small">
        Si no recibes el correo, intenta nuevamente en unos minutos
    </div>

</div>

</body>
</html>
